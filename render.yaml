services:
  - type: web
    name: pre-dispute
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_FALLBACK_MODEL
        value: gemini-3.5-flash,gemini-3.1-flash-lite,gemini-2.5-flash-lite
      - key: DB_PATH
        value: /tmp/pre-dispute.db
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
